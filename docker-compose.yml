services:
  backend:
    build:
      context: ./backend
    ports:
      - "8100:8100"
    environment:
      BENCHFILE_PROMPTBENCH_BASE_URL: ${BENCHFILE_PROMPTBENCH_BASE_URL:-http://host.docker.internal:8020}
      BENCHFILE_DEFAULT_MODEL: ${BENCHFILE_DEFAULT_MODEL:-gemma3:4b}
      BENCHFILE_REQUEST_TIMEOUT_SECONDS: ${BENCHFILE_REQUEST_TIMEOUT_SECONDS:-300}
      BENCHFILE_STORAGE_ROOT: ${BENCHFILE_STORAGE_ROOT:-/app/storage}
    volumes:
      - benchfile-storage:/app/storage
    networks:
      - workshop-net

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_EXPERIMENTS_API_URL: /api/experiments
      EXPERIMENTS_BACKEND_URL: http://backend:8100
    depends_on:
      - backend
    networks:
      - workshop-net

volumes:
  benchfile-storage:

networks:
  workshop-net:
    driver: bridge
